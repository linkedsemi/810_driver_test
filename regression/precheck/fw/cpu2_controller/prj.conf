# 环境预检固件（controller 核，board cpu2）——从 i3c case controller 侧
# prj.conf 拷贝裁剪：删 i3c/ztest 项（预检非 ztest，A4）。§4.7 log 输出规范：
# deferred 模式 + LOG_BACKEND_UART + LOG_PRINTK=n（banner 走 printk 直通
# console UART，不被 log 子系统吞）。
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
# printk 直通 console UART，不经 log 子系统（deferred+shell 后端会吞 printk）
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
