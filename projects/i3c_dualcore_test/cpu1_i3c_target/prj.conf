CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
# 逐项 START/PASS 行是 parse_ztest 数据源，必须开启（§10.26）
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
CONFIG_I3C=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_IBI_MAX_PAYLOAD_SIZE=8
CONFIG_I3C_LOG_LEVEL_OFF=y
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# GPIO support for PA05/PA07 toggle threads
CONFIG_GPIO=y

# RLOG 单出口（SPEC_REFERENCE §6.9.3）：从核经 mbox 把 token 交给主核统一打印
CONFIG_MBOX=y
# ztest 输出换后端（§6.11.5）：tc_util.h 在定义 PRINT_DATA 前 include
# `tc_util_user_override.h`（见本核 src/），把逐项输出指向 RLOG。
CONFIG_ZTEST_TC_UTIL_USER_OVERRIDE=y
