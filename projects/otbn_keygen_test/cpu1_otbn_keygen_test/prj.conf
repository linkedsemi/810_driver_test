# OTBN RSA 密钥生成单核测试（cpu1 安全域，lsqsh_evb@1os/lsqsh/cpu1）
# 被测：zephyr/soc/linkedsemi/lsqsh/otbn/otbn_rsa_keygen.c
#       + 重构后的 mbedtls keygen hook（modules/crypto/mbedtls/library/rsa_alt.c）。

# ---- libc 三件套（全工程统一；缺一构建失败，KNOWN_ISSUES #58） ----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- log 输出规范（810 CLAUDE.md §4.1：统一 LOG_INF，deferred buf 模式） ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n

# ---- ztest 原生框架（verbose 逐项输出是 harness 数据源；=n 则逐项全 MISSING） ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# keygen / CPU 侧 Miller-Rabin 大数运算栈需求
CONFIG_ZTEST_STACK_SIZE=40960
CONFIG_MAIN_STACK_SIZE=8192

# ---- 被测模块：OTBN RSA keygen（otbn_rsa_keygen.c 编入） ----
CONFIG_LS_OTBN_RSA_KEYGEN=y

# ---- mbedtls：keygen hook 路径 + CPU 侧独立复算（bignum） ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
# 走 OTBN keygen hook（select LS_OTBN_RSA_KEYGEN）；
# 关掉它也编不出本路径 ⇒ 本工程用它覆盖 rsa_alt.c 重构。
CONFIG_MBEDTLS_RSA_LINKEDSEMI_OTBN_ALT=y
# CPU 侧 mbedtls_mpi_is_prime_ext（Miller-Rabin）门控
CONFIG_MBEDTLS_GENPRIME_ENABLED=y

CONFIG_DMA=y

# GPIO support for PA05/PA07 toggle threads
CONFIG_GPIO=y
