# otbn_keygen_test —— 工程识别信息 + 本工程启用的测试 case
#
# ⚠️ 2026-10-26：本工程的测试体已合并进 projects/otbn_test（suite `keygen`），
#    不再在 regression/cases.yaml 登记。源码保留在原位，作为 otbn_test 与
#    integrated/sets/itest_crypto_otbn 的共享源（避免复制分叉）。
#    独立构建/运行能力仅为历史保留，日常回归请走 otbn_test。
#
# ⚠️ 顶部 meta 块**只是给人和外部工具读的识别信息**；run_all.py 只消费 `cases:` 段，
#    改 meta 不影响回归。各字段均由工程目录/代码导出（改工程即随之变化）。
#
meta:
  board: lsqsh_evb@1os/lsqsh/cpu1
  cores: 单核
  firmware: [cpu1_otbn_keygen_test]
  kconfig: [cpu1_otbn_keygen_test/prj.conf]
  run: tests/run_test.py
  env: 无外部接线
  title: OTBN RSA 密钥生成
  coverage: tests/COVERAGE.md    # 工程定位 / 测试内容 / 环境需求 / 覆盖矩阵的权威源
#
# 只有 `cases:` 之后、以 `- ` 开头的行才是 case；`#` 开头一律忽略（`#` 屏蔽 = 跳过）。
# 本段决定 `regression/cases.yaml` 路由到本工程后**实际跑哪些 case** ——
# 新增 case：在 `tests/` 下建目录并在此登记（不登记 = 不跑）。
cases:
  - case_default
