# Ethernet test (eth1 + 板载 RTL8211F PHY) —— cpu1 侧固件配置
#
# 配置基准：linkedsemi_zephyr_project/samples/zperf/（本板已实测跑通的以太网
# 网络栈配置）+ zperf/boards/lsqsh_evb_cpu1.conf（CONFIG_MDIO=y）。

# ---- 810 公共固件规范（SPEC_REFERENCE §6.1）----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
# 810 各工程一律 CONFIG_SHELL=n，但 eth_dwmac.c:800-832 在文件末尾**无条件**
# 注册 shell 命令（SHELL_CMD_ARG_REGISTER 在 CONFIG_SHELL=n 下不是空宏，
# 而是把 entry 放进 shell_root_cmds 段），其 handler 调用 shell_error() ->
# shell_fprintf_error()，该符号只在 CONFIG_SHELL=y 时编入 ⇒ SHELL=n 必然
# 链接失败（undefined reference to `shell_fprintf_error`）。
# 折中：开 SHELL 拿到符号，但**关掉串口 backend、只留 dummy backend**，
# shell 线程无传输通道，不产生提示符/不占用 uart1 RX，ztest 串口流不受污染。
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# libc 三件套（KNOWN_ISSUES #58）
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
CONFIG_GPIO=y

# ---- 以太网 / MDIO ----
# MDIO 驱动（snps,dwmac-mdio -> mdio_dwmac.c）的 init 挂在
# CONFIG_NETWORKING_AUTO_INIT 下（mdio_dwmac.c:387），故网络栈必须打开，
# 否则 mdio1 设备不会做时钟/pinctrl/复位初始化，MDIO 事务必然超时。
# eth1（linkedsemi,ethernet -> eth_dwmac_linkedsemi.c + eth_dwmac.c）经
# CONFIG_ETH_DWMAC 编入，其依赖 NET_BUF_FIXED_DATA_SIZE 也由网络栈提供。
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_MDIO=y
CONFIG_MDIO_SHELL=n
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=n
# eth_dwmac.c 的 RX refill 线程优先级取 CONFIG_NET_TCP_WORKER_PRIO-1
# （eth_dwmac.c:73），故 NET_TCP 必须编入，否则该符号未定义、驱动编不过。
CONFIG_NET_TCP=y
# MAC 地址由 dwmac_platform_init() 的 gen_random_mac() 生成
CONFIG_TEST_RANDOM_GENERATOR=y

# 缓冲/描述符：DATA_SIZE 取 1600（= zperf 实测值），使 1500B 帧单片容纳，
# 描述符数与 net_buf 数对齐（RX/TX 各 16）。
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_DWMAC_NB_RX_DESCS=16
CONFIG_DWMAC_NB_TX_DESCS=16

# ---- B 组数据面（ARP / ICMP / UDP echo）追加项（2026-09-17，纯追加）----
# 地址为**约定值**，P6 按实际网络调整时只改下面两行（必须同网段）。
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.100"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.1"
# 0 = 启动阶段不等待链路就绪（默认 30 s：网线未插/对端未激活时会让开机阻塞，
# 进而吃掉 case 超时窗口）。静态地址仍在 net_config 的 SYS_INIT 里立即写入。
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
