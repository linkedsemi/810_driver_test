# i3c_i2c_switch_test —— 工程识别信息 + 本工程启用的测试 case
#
# ⚠️ 顶部 meta 块**只是给人和外部工具读的识别信息**；run_all.py 只消费 `cases:` 段，
#    改 meta 不影响回归。各字段均由工程目录/代码导出（改工程即随之变化）。
#
meta:
  board: lsqsh_evb@2os
  cores: 双核
  firmware: [cpu0_i3c_controller, cpu1_i3c_target]
  kconfig: [cpu0_i3c_controller/prj.conf, cpu1_i3c_target/prj.conf]
  run: tests/run_test.py
  env: 需接线：复用 i3c_dualcore_test 的 I3C5↔I3C6 两根线
  title: I3C/I2C 两种模式间动态切换
  coverage: tests/COVERAGE.md    # 工程定位 / 测试内容 / 环境需求 / 覆盖矩阵的权威源
#
# 只有 `cases:` 之后、以 `- ` 开头的行才是 case；`#` 开头一律忽略（`#` 屏蔽 = 跳过）。
# 本段决定 `regression/cases.yaml` 路由到本工程后**实际跑哪些 case** ——
# 新增 case：在 `tests/` 下建目录并在此登记（不登记 = 不跑）。
cases:
  - case_switch_core
  # 控制器侧 `&i3c5 { no-bus-init; };`：驱动 init 跳过总线枚举，应用显式
  # i3c_bus_init() 补回。A/B 折进 i3c_baseline 项（见 COVERAGE.md）。
  - case_no_bus_init
