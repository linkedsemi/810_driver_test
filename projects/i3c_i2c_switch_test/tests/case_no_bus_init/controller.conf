# no-bus-init case：无额外 Kconfig 覆盖，使用工程默认 prj.conf 作为基座。
#
# 开关走**设备树属性**（controller.overlay 的 `&i3c5 { no-bus-init; };`），
# 固件侧用 `#if DT_PROP(DT_NODELABEL(i3c5), no_bus_init)` 门控 ——
# 不用 Kconfig：本工程 cpu0 没有应用 Kconfig 根，新增一个会改 KCONFIG_ROOT，
# 对既有 case_switch_core 属潜在爆炸半径（qsh-test-gen §2「变体」注）。
#
# ⚠️ 门控**不能**写 DT_NODE_HAS_PROP：boolean 属性在 binding 声明后
#    所有实例的 `_EXISTS` 恒为 1 ⇒ 门控恒真、既有 case 会被误跑 A/B。
#    真正的"写了没有"在值宏里（DT_PROP = 0/1）。详见固件内同处注释。
