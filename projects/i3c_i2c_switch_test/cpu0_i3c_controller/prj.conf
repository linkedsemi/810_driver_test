CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
# printk 直通 console UART，不经 log 子系统（deferred+shell 后端会吞 printk）
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
# R7：n→y——逐项 START/PASS/FAIL 行是 parse_ztest 的数据源（§10.26）
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# 'P' 收尾通知已按 Task 8 审查 Critical 1 移到 zt_run_all() 后（test_main
# 线程，不经 ztest 测试线程）；测试体仅等快照（k_sleep+zassert），但 zassert
# 失败打印路径 + 断言宏展开栈深保守给 2048（样板 i3c_dualcore_test 无此项，
# 若回归无栈问题可再调小）
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_I3C=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_IBI_MAX_PAYLOAD_SIZE=8
CONFIG_I3C_LOG_LEVEL_ERR=y
CONFIG_I2C=y
# RLOG 单出口（SPEC_REFERENCE §6.9.3）：主核收从核 token 行并原样打印
CONFIG_MBOX=y
# pinctrl_apply_state() 运行时切换 I3C/I2C 引脚复用（本工程核心机制）
CONFIG_PINCTRL_DYNAMIC=y
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# GPIO support for PA05/PA07 toggle threads
CONFIG_GPIO=y
