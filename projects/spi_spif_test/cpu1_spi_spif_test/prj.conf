# spi_spif_test 单核 cpu1 固件配置：spi_ls（spi1/spi2）+ spi_filter（spif1..4）
# + spif3 master -> spi4 -> flash4_0（SPEC_REFERENCE §6.1.7 / §6.1.8）。

# ---- log 规范（§6.1.7）：统一 LOG_INF，buf 模式异步输出 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

# ---- ztest（§6.2.1）：逐项输出必须打开 ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# ---- libc 三件套（§10.35 / KNOWN_ISSUES #58）----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- SPI：spi1/spi2（linkedsemi,ls-spi）+ spi3/spi4（snps,designware-spi）----
# 实例在 overlay 置 okay 后由 DT_HAS_*_ENABLED 自动编入；这里显式声明意图。
CONFIG_SPI=y
CONFIG_SPI_DW=y
CONFIG_SPI_EXTENDED_MODES=y

# ---- 被测驱动：pfr_tpm spi filter（spif1..4）----
# CONFIG_SPI_FILTER_LINKEDSEMI 默认 y（depends on DT_HAS_LINKEDSEMI_SPI_FILTER_ENABLED），
# 且 select SPI / select DMA；CONFIG_PFR_TPM_LINKER_LD 随之 default y
# （模块 common/linker.ld 把各实例的白名单镜像放 PFR_TPM 段，本工程依赖该段）。
CONFIG_SPI_FILTER_LINKEDSEMI=y
CONFIG_DMA=y

# ---- flash4_0：jedec,spi-nor 上层（spi_nor_multi_dev.c）----
# 老的单实例 SPI_NOR 驱动必须关掉（spi_nor_multi_dev.c 顶部有 #error 守卫）。
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y
CONFIG_SPI_NOR=n
CONFIG_SPI_NOR_MULTI_DEV=y

# ---- spi_flash 套件的 malloc 缓冲用例：k_malloc / k_aligned_alloc ----
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ---- GPIO toggle 线程（公共层 gpio_toggle.c 依赖）+ spi1/spi2 的 CS GPIO ----
CONFIG_GPIO=y

# ---- 复位/掉电维度用例（post_reset_state）需要 reset 子系统 ----
CONFIG_RESET=y

# ---- spi_ls.c:415-472 的 clock_control/on/off 路径 ----
CONFIG_CLOCK_CONTROL=y
