CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# libc 选择（与全部单核工程统一，CLAUDE.md §4.2）：minimal libc 不提供
# mktime()，而共享 HAL modules/hal/linkedsemi/soc/rv32/qsh/platform.c 的
# rtc_timer_set_time() 自 2026-09-16 起调用 mktime → 缺此配置则 1os 构建
# 报 implicit declaration of 'mktime' 直接失败。picolibc 提供 mktime。
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
# linkedsemi_ls_rtc 驱动（rtc_ls.c）：dts rtc status=okay 后
# CONFIG_RTC_LS default y + DT_HAS_LINKEDSEMI_LS_RTC_ENABLED 自动使能
CONFIG_RTC=y
CONFIG_RTC_LS=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_CALIBRATION=y
# RTC update 事件回调（P1a 新增配置项）：开此项后 rtc_ls.c 的
# `#if defined(CONFIG_RTC_UPDATE)` 分支才编入（rtc_ls_update_set_callback
# 桩固定返回 -ENOTSUP），配套用例 update_callback_notsup。
CONFIG_RTC_UPDATE=y

# GPIO support for PA05/PA07 toggle threads
CONFIG_GPIO=y
