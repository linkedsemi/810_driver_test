CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# linkedsemi_ls_rtc 驱动（rtc_ls.c）：dts rtc status=okay 后
# CONFIG_RTC_LS default y + DT_HAS_LINKEDSEMI_LS_RTC_ENABLED 自动使能
CONFIG_RTC=y
CONFIG_RTC_LS=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_CALIBRATION=y
CONFIG_NEWLIB_LIBC=n
