# i2cf_test 单核 cpu1 固件配置（SPEC_REFERENCE §6.1.7 / §6.1.8）。

# ---- log 规范（§6.1.7）：统一 LOG_INF，buf 模式异步输出 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

# ---- ztest（§6.2.1）：逐项输出必须打开，否则 START/PASS/FAIL 全 MISSING ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# ---- libc 三件套（§10.35 / KNOWN_ISSUES #58）：缺一构建失败 ----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO toggle 线程（公共层 gpio_toggle.c 依赖）----
CONFIG_GPIO=y

# ---- 被测驱动：pfr_tpm i2c filter ----
# CONFIG_I2C_FILTER_LINKEDSEMI 默认 y（depends on DT_HAS_LINKEDSEMI_I2C_FILTER_ENABLED，
# overlay 使能 **i2cf4**（被测那一个）后成立）；显式写出以固化本工程意图并 select I2C。
# ⚠️ i2cf1 / i2cf2 / i2cf3 已按拓扑**关掉**（纯主/从实例的配对滤波器，会争引脚）——
#    见 app.overlay 的说明块。
CONFIG_I2C=y
CONFIG_I2C_FILTER_LINKEDSEMI=y

# ---- 片内 I2C target（★ 2026-09-22 用户裁定：**不管外部 EEPROM 的存在**）----
# 在**从机 i2c3** 上挂一个片内从设备（overlay 的 `&i2c3 / eeprom@33`），
# 取代原先"外接 EEPROM（0x51/0x52，未经实测）"的假设 ⇒ B 组三项变成**零外部器件**。
# 驱动 init 不自注册，应用须调 `i2c_target_driver_register()`（见 src/i2cf_test.c）。
# 做法同 `modules/lib/pfr_tpm/samples/i2c_filter_loopback`（其 prj.conf 同款两行）。
CONFIG_I2C_TARGET=y
CONFIG_I2C_EEPROM_TARGET=y
