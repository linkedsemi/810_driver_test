# case_enum_matrix —— I2CF 状态枚举矩阵一次性探针
#
# 目的：把「白名单内/外 × 读/写 × 有/无器件 × 滤波器开/关 → 反馈状态
#       （ret / 是否上报 / ERR 日志 / SMBF_NONWHITELIST）」的枚举表填满。
#       重点补 #5「白名单内 + 无器件」。
#
# 只观测、不含 zassert 判据；不登记进 regression/cases.yaml（一次性探针）。
#
# ⚠️ Zephyr .conf 不支持行内注释：本文件每行要么是整行 # 注释，要么是 CONFIG_ 赋值。
CONFIG_I2CF_ENUM_MATRIX=y
