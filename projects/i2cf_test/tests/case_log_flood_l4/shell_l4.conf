# One-off diagnostic conf: log_flood shell command (CONFIG_I2CF_LOG_FLOOD).
# Customer shell/log backend config; QUEUE_SIZE is in BYTES
# (shell_log_backend.h: buf[_queue_size / sizeof(uint32_t)], .size in words).

# Group L4: QUEUE=512B TIMEOUT=0

CONFIG_I2CF_LOG_FLOOD=y

CONFIG_SHELL=y
CONFIG_SHELL_AUTOSTART=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=0
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8

CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=n
