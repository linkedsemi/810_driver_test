CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
# printk 直通 console UART，不经 log 子系统（deferred+shell 后端会吞 printk）
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
# ztest 原生逐项输出（START - <name> / " PASS - <name> in X.XXX seconds"）
# 是 common/ztest_report.parse_ztest 的数据源（ztest 框架内由
# CONFIG_ZTEST_VERBOSE_OUTPUT 门控，必须打开；=n 时 harness 只见
# PROJECT EXECUTION 一行，逐项结果全 MISSING）。
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# i2c_wave 测试体含 i2c_ls 驱动调用链（i2c_target_register 等），
# 测试线程栈给 2KB 余量（默认 1024 是单核 trng/rtc 样板用值）
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_I2C=y
# i2c6 以 I2C slave 角色响应 i2c5 的访问（普通回调模式，非 BUFFER_MODE）
CONFIG_I2C_TARGET=y
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# GPIO support for PA05/PA07 toggle threads
CONFIG_GPIO=y

# RLOG 单出口（SPEC_REFERENCE §6.9.3）：从核经 mbox 把 token 交给主核统一打印
CONFIG_MBOX=y
# ztest 输出换后端（§6.11.5）：tc_util.h 在定义 PRINT_DATA 前 include
# `tc_util_user_override.h`（见本核 src/），把逐项输出指向 RLOG。
CONFIG_ZTEST_TC_UTIL_USER_OVERRIDE=y
