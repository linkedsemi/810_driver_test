# case_fat_fs_api 增量配置
# （与上游 prj_mmc.conf 拼成 -DCONF_FILE=<上游>/prj_mmc.conf;<本文件>）
#
# 上游 zephyr/tests/subsys/fs/fat_fs_api 的 testcase.yaml 对 mmc 平台只传
# CONF_FILE="prj_mmc.conf"（覆盖 prj.conf）。实测在该板级下仅用 prj_mmc.conf
# **链接失败**：app/libapp.a(test_fs_mkfs.c.obj) undefined reference to `fs_mkfs`
# —— 因为 test_fat_mkfs.c / ../common/test_fs_mkfs.c 的编译条件只看 CONFIG_FLASH，
# 而 fs_mkfs 需要 CONFIG_FILE_SYSTEM_MKFS。上游能过是因为它自己的 prj.conf
# 里有该项，而 mmc 用例把 prj.conf 整个替换掉了（上游 CI 未覆盖该组合）。
#
# 本文件是 810 侧的**增量 conf**，只补上游 mmc 组合缺的两项，不改上游任何文件。
CONFIG_FILE_SYSTEM_MKFS=y

# ztest 逐项输出（SPEC_REFERENCE §10.26：=n 则 START/PASS/FAIL 行被抑制）
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
