# case_block_pio —— 相对 firmware prj.conf 的**增量**配置
# （build_single_test 会拼成 -DCONF_FILE=<fw>/prj.conf;<本文件>）
#
# 关掉 SDMA → sdhci-of-linkedsemi.c 的 linkedsemi_sdhci_transfer_blocking() 里
# `host->use_dma = IS_ENABLED(CONFIG_SDHCI_SDMA_ENABLE)` 变为 false，
# 数据通路走 ISR 轮询搬运（sdhci-of-linkedsemi.c:142-163 的 polling else 分支），
# 与 case_block_driver（DMA）构成"传输方式 × 缓冲对齐"的象限覆盖。
CONFIG_SDHCI_SDMA_ENABLE=n
