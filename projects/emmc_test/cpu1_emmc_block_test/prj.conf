# eMMC block-layer test — cpu1（单核 1os）配置
# 被测：zephyr/drivers/sdhc/sdhci-of-linkedsemi.c（linkedsemi,sdhci）
#       + zephyr/drivers/disk/mmc_subsys.c（zephyr,mmc-disk，盘名 "SD2"）

# ---- ztest 基础（SPEC_REFERENCE §6.2.1）----
CONFIG_ZTEST=y
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
# MMC/FAT 链路调用栈较深（sd_init 走 CMD 序列 + EXT_CSD/SFDP 解析）
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096

# ---- log 规范（SPEC_REFERENCE §6.1.7）----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n

# ---- libc 三件套（KNOWN_ISSUES #58，缺一构建失败）----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO toggle（common/gpio_toggle.dtsi 使能 GPIOA）----
CONFIG_GPIO=y

# ---- 块设备栈：disk_access + MMC disk（zephyr,mmc-disk，DT 里 default y）----
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_MMC=y
# 本工程只测块层，不挂文件系统
CONFIG_FILE_SYSTEM=n
