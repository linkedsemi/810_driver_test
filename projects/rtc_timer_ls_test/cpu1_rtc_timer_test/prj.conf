CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# rtc_timer_ls：platform.c 用 mktime/localtime_r，Kconfig 要求 NEWLIB||PICOLIBC
# 本工程强制 PICOLIBC（禁用 NEWLIB）
CONFIG_RTC=y
CONFIG_RTC_TIMER_LS=y
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# 不测 PMU 硬件 RTC，避免与软件 RTC 抢同一套时间语义
# CONFIG_RTC_LS 由 DT 关闭后自动不编

# 单核测试：不启 cpu2（避免旧镜像干扰）
CONFIG_BOOT_CPU2=n

CONFIG_GPIO=y
