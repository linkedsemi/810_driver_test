# spi_test 单核 cpu1 固件配置（SPEC_REFERENCE §6.1.7 / §6.1.8）。

# ---- log 规范（§6.1.7）：统一 LOG_INF，buf 模式异步输出 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

# ---- ztest（§6.2.1）：逐项输出必须打开 ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# ---- libc 三件套（§10.35 / KNOWN_ISSUES #58）----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO toggle 线程（公共层 gpio_toggle.c 依赖）+ spi1/spi2 的 CS GPIO ----
CONFIG_GPIO=y

# ---- 被测驱动：zephyr/drivers/spi/spi_ls.c（linkedsemi,ls-spi）----
# spi1/spi2 的节点在 overlay 置 okay 后，DT_INST_FOREACH_STATUS_OKAY 自动编入。
CONFIG_SPI=y

# ---- P4.6 回环用例（spi3 = 主设备，spi_dw.c；spi1 = 从设备，spi_ls.c）----
# spi3 在 overlay 置 okay 后 SPI_DW 自动编入（DT_HAS_SNPS_DESIGNWARE_SPI_ENABLED），
# 这里显式声明以固定意图。
CONFIG_SPI_DW=y
# spi_ls.c 的从设备路径：spi_ls_data_exchange_slave()（:207-236）由
# SPI_OP_MODE_SLAVE 触发；:362-366 的 recv_frames 返回值也在本开关下才编译。
# ⚠️ 副作用：spi_context_wait_for_completion()（spi_context.h:153-154）在从模式
#    下改用 K_FOREVER（无超时）⇒ 回环用例的从设备一律跑在独立线程 + 有界 join，
#    见 src/spi_loopback.c。
CONFIG_SPI_SLAVE=y

# ---- 复位/掉电维度用例（post_reset_state）需要 reset 子系统 ----
CONFIG_RESET=y

# ---- spi_ls.c:415-472 的 clock_control/on/off 路径 ----
CONFIG_CLOCK_CONTROL=y
