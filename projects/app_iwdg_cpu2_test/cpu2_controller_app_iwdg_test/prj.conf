CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
CONFIG_WATCHDOG=y
# 驱动 iwdt_init 的 WDT_DISABLE_AT_BOOT 分支保持关闭：cpu2 侧用例依赖
# quick-enable 的启动态可观测（case_quick_enable）。
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
CONFIG_GPIO=y

# RLOG 单出口（SPEC_REFERENCE §6.9.3）：主核收从核 token 行并加核信封转发
CONFIG_MBOX=y
