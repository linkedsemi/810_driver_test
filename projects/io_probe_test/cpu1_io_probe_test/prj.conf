# io_probe_test 单核 cpu1 固件配置（SPEC_REFERENCE §6.1.7 / §6.1.8）。

# ---- log 规范（§6.1.7）：统一 LOG_INF，buf 模式异步输出 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

# 本工程会连吐 ~20KB 矩阵（每行 ~150 字符）。deferred 模式下**格式化发生在
# log 线程**，150 字符的行需要比默认 1024 更宽的栈。
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# ---- ztest（§6.2.1）：逐项输出必须打开，否则 START/PASS/FAIL 全 MISSING ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# 用例线程栈：报告打印走 snprintf + LOG_INF 宏，默认 1024 偏紧。
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# ---- libc 三件套（§10.35 / KNOWN_ISSUES #58）：缺一构建失败 ----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO toggle 线程（公共层 gpio_toggle.c 依赖）----
CONFIG_GPIO=y

# ---- 本工程无被测外设驱动 ----
# 只做 GPIO 位操作。i2c2/3/4、i2cf2/3/4、spi1/3/4、spif1..4、i3c5/6 全部保持
# status = "disabled"（见 app.overlay 注释）—— 它们的 pinctrl 不会被 apply，
# 候选脚停在 GPIO 复位态，由 gpio_lsqsh.c 直接以寄存器方式接管。
