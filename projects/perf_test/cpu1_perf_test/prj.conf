# SPDX-License-Identifier: Apache-2.0
# perf_test cpu1: TRNG / crypto / DMA / mbox throughput.
# The project only reports rates; functional assertions still guard each path.

CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# The telemetry relay thread and the ztest thread both printk on cpu1;
# without this lock their characters interleave and the PERF_TEST:CTRL:
# envelope gets split (observed on hardware).
CONFIG_PRINTK_SYNC=y

CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=10240

CONFIG_TIMING_FUNCTIONS=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_DMA=y
CONFIG_MBOX=y
CONFIG_GPIO=y

# ---- flash / qspi throughput ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ---- mbedtls: accelerated hashes and ciphers ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
# Required by the *_HARDWARE_ALT hash/cipher paths (same as otbn_selftest):
# without it sha256_alt.c / sha512_alt.c fail on mbedtls_threading_mutex_t.
CONFIG_MBEDTLS_THREADING_LINKEDSEMI_ALT=y

CONFIG_MBEDTLS_SHA224=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_SHA512=y
# cpu1 runs the hardware SHA/SM3 engine; cpu2 runs OTBN (see cpu2_perf_peer).
CONFIG_MBEDTLS_SHA224_SHA256_LINKEDSEMI_HARDWARE_ALT=y
CONFIG_MBEDTLS_SM3_LINKEDSEMI_HARDWARE_ALT=y
CONFIG_MBEDTLS_SHA384_SHA512_LINKEDSEMI_HARDWARE_ALT=y

CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_AES_LINKEDSEMI=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED=y
CONFIG_MBEDTLS_SM4_LINKEDSEMI_HARDWARE_ALT=y

CONFIG_SM4_CLOCK_RESET=y
CONFIG_AES_CLOCK_RESET=y
CONFIG_SHA512_CLOCK_RESET=y
CONFIG_SHA256_CLOCK_RESET=y
