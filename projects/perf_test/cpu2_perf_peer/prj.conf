CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# mbedtls_ls_otbn_rsa_modexp() puts four MBEDTLS_MPI_MAX_SIZE (1 KB) buffers
# on the stack; 4 KB overflowed on hardware (kernel panic).  Leave headroom
# for the OTBN call frame as well.
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

CONFIG_MBOX=y
CONFIG_GPIO=y

# ---- OTBN crypto (cpu2 side; cpu1 runs the hardware engines) ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_SHA224_SHA256_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_SM3_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_SHA384_SHA512_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_RSA_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_THREADING_LINKEDSEMI_ALT=y
CONFIG_LS_OTBN_OPERATION_TIMEOUT_MS=60000
