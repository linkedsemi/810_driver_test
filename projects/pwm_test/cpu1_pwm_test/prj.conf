CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_SERIAL=y
CONFIG_SHELL=n
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# PWM 驱动依赖链：PWM_LS depends on CLOCK_CONTROL 并 select PINCTRL；
# RESET 必须显式开 —— lsqsh 的 pwm 节点带 `resets` 属性，而驱动里
# `IF_ENABLED(DT_INST_NODE_HAS_PROP(n, resets), (.reset = RESET_DT_SPEC_INST_GET(n),))`
# 未加 CONFIG_RESET 守卫，成员声明却带守卫 ⇒ CONFIG_RESET=n 时该指定初始化项
# 指向不存在的成员，编译报错（驱动缺陷，只登记不修，见 COVERAGE.md「驱动观察」）。
CONFIG_PWM=y
CONFIG_CLOCK_CONTROL=y
CONFIG_RESET=y
CONFIG_PWM_LOG_LEVEL_INF=y
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
CONFIG_GPIO=y
