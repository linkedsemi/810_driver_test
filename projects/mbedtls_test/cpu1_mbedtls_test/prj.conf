# mbedtls 单核测试基座配置（cpu1 安全域，lsqsh_evb@1os/lsqsh/cpu1）。
# 本文件只放全 case 公共项；被测 Kconfig 路由（LINKEDSEMI ALT / OTBN / SM4 HW）
# 由各 case 的 case.conf 差异注入（tests/case_*/case.conf，CONF_FILE 合并）。
# 配置来源：projects/otbn_test/cpu1_otbn_test/prj.conf +
# samples/mbedtls_test（boards/lsqsh_evb_cpu1.conf）的算法套件并集，
# 去掉全部路由项（默认 n）。

# ---- log 输出规范（CLAUDE.md §4.7：统一 LOG_INF，deferred buf 模式） ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y

# ztest 原生框架：测试主体跑 ztest 线程（CONFIG_ZTEST_STACK_SIZE 承载 RSA/
# 大缓冲测试栈需求），main 线程只跑 zt_init + zt_run_all 框架。
# CONFIG_ZTEST_VERBOSE_OUTPUT 是逐项 START/PASS/FAIL 行的门控（§10.26，
# =n 时 harness 只见 PROJECT EXECUTION 一行，逐项结果全 MISSING）。
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
CONFIG_ZTEST_STACK_SIZE=40960
CONFIG_MAIN_STACK_SIZE=10240

CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
CONFIG_TIMING_FUNCTIONS=y

# TRNG（RSA keygen 真随机源 + ECDSA genkey，entropy_get_entropy_isr BUSYWAIT）
CONFIG_ENTROPY_GENERATOR=y
CONFIG_DMA=y

# ---- mbedtls 核心 ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_THREADING_LINKEDSEMI_ALT=y
# P1a 新增配置项（2026-09-17）：打开 buffer allocator 的用量计数
# （total_used/header_count/maximum_used）与 cur_get/max_get API，
# 供 robustness 套件的 heap_stress_keygen 监控堆水位（MBED-04）。
# 该开关只加计数，不改变分配行为（库源码 memory_buffer_alloc.c 内均在
# MBEDTLS_MEMORY_DEBUG 之下）。
CONFIG_MBEDTLS_MEMORY_DEBUG=y

# ---- 算法套件（全 case 公共；路由项在各 case.conf） ----
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_SHA224=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_ALL_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=y
CONFIG_MBEDTLS_GENPRIME_ENABLED=y

# GPIO support for PA05/PA07 toggle threads
CONFIG_GPIO=y
