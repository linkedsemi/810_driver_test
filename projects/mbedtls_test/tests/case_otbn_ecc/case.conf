# case_otbn_ecc：ECDSA（P256/P384/SM2）走 OTBN，其余 mbedtls 纯软。
# Kconfig 前缀 CONFIG_ + 文件内名字，见 zephyr/soc/linkedsemi/lsqsh/otbn/Kconfig.mbedtls。
CONFIG_MBEDTLS_LINKEDSEMI_OTBN=y
CONFIG_MBEDTLS_ECDSA_SECP256R1_SECP384R1_SM2_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_ECP_DP_SM2_ENABLED=y
CONFIG_LS_OTBN_OPERATION_TIMEOUT_MS=60000
CONFIG_MBEDTLS_LINKEDSEMI_OTBN_DELEGATION_CLIENT=n
CONFIG_MBEDTLS_LINKEDSEMI_OTBN_DELEGATION_SERVER=n
