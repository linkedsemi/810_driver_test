# case_thread_mix：otbn_all + THREADING_ALT + 双线程并发，验证 OTBN 调度无竞争崩溃。
CONFIG_MBEDTLS_LINKEDSEMI_OTBN=y
CONFIG_MBEDTLS_SHA224_SHA256_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_SM3_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_SHA384_SHA512_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_ECDSA_SECP256R1_SECP384R1_SM2_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_RSA_LINKEDSEMI_OTBN_ALT=y
CONFIG_MBEDTLS_ECP_DP_SM2_ENABLED=y
CONFIG_MBEDTLS_THREADING_LINKEDSEMI_ALT=y
CONFIG_LS_OTBN_OPERATION_TIMEOUT_MS=60000
