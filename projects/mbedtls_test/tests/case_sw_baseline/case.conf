# case_sw_baseline：全部 LINKEDSEMI ALT 关（mbedtls 纯软基线）。
# 基座 prj.conf 未开任何路由项（soc Kconfig.mbedtls 16 项全部 default n），
# 本 case 无差异配置；显式关闭 OTBN 总开关防板级/全局 defconfig 残留。
# 被测路由：软件路径 = 判定基线（其余 case 与本基线向量级对齐）。
CONFIG_MBEDTLS_LINKEDSEMI_OTBN=n
CONFIG_MBEDTLS_ECP_DP_SM2_ENABLED=n
CONFIG_MBEDTLS_SM4_LINKEDSEMI_HARDWARE_ALT=n
CONFIG_MBEDTLS_SHA224_SHA256_LINKEDSEMI_HARDWARE_ALT=n
