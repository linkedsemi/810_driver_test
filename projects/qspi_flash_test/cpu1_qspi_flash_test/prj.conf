# QSPI flash test — cpu1（单核 1os）配置
# 被测：zephyr/drivers/spi/qspi_ls.c（linkedsemi,ls-qspi）
#       + zephyr/drivers/flash/spi_nor_multi_dev.c（jedec,spi-nor 上层）
#
# 配置参考已实测跑通的 sample：linkedsemi_zephyr_project/samples/spi_ls_flash_nor/

# ---- ztest 基础（SPEC_REFERENCE §6.2.1）----
CONFIG_ZTEST=y
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_ASSERT_VERBOSE=1

# ---- log 规范（SPEC_REFERENCE §6.1.7）----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n

# ---- libc 三件套（KNOWN_ISSUES #58，缺一构建失败）----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO toggle（common/gpio_toggle.dtsi 使能 GPIOA）----
CONFIG_GPIO=y

# ---- SPI / SPI-NOR 栈 ----
# 注意：被测是 qspi_ls.c（jedec,spi-nor + SPI_NOR_MULTI_DEV），
#       不是 spi_ls.c；CONFIG_SPI_NOR（旧单实例驱动）必须关掉。
CONFIG_SPI=y
CONFIG_SPI_EXTENDED_MODES=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# 暴露 flash_read_jedec_id / flash_sfdp_read（spi_nor_multi_dev.c 挂在
# CONFIG_FLASH_JESD216_API 下，用于 JEDEC ID 断言与 SFDP 头读取）
CONFIG_FLASH_JESD216_API=y
CONFIG_SPI_NOR=n
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SPI_NOR_MULTI_DEV=y
