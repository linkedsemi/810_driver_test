# case_rsa_delegation: the SERVER must build its local OTBN RSA backend, which
# answers the client's modexp requests (otbn_deleg_rsa_modexp_pub/prv ->
# mbedtls_ls_otbn_rsa_modexp in rsa_alt.c). Without it the handlers answer
# -EOPNOTSUPP and r01/r02 fail.
CONFIG_MBEDTLS_RSA_LINKEDSEMI_OTBN_ALT=y

# The server handler runs on the SYSTEM WORKQUEUE and the byte-level RSA
# backend keeps 4 x MBEDTLS_MPI_MAX_SIZE (4 KiB) of scratch on the stack
# (rsa_alt.c mbedtls_ls_otbn_rsa_modexp), which does not fit the 1 KiB default.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
