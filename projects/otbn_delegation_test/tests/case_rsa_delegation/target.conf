# case_rsa_delegation: the SERVER must expose the RSA proxy family and build
# its local OTBN RSA backend. The first switch registers the modexp handlers in
# the bus op table; the second gives them a real backend. Without the family
# switch the client's op is reported as unknown; without the backend it answers
# LS_OTBN_ERR_NOSUPP (the client sees MBEDTLS_ERR_ECP_FEATURE_UNAVAILABLE).
CONFIG_MBEDTLS_LINKEDSEMI_OTBN_RSA_MBOX=y
CONFIG_MBEDTLS_RSA_LINKEDSEMI_OTBN_ALT=y