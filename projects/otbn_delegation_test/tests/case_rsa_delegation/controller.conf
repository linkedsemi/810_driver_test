# case_rsa_delegation: the CLIENT needs the RSA proxy family switch. The RSA
# proxy is always explicit (mbedtls_ls_otbn_rsa_modexp_encrypt/_decrypt), so
# unlike ECDSA there is no mbedtls RSA ALT to route through the delegation;
# the project prj.conf already enables the delegation client.
CONFIG_MBEDTLS_LINKEDSEMI_OTBN_RSA_MBOX=y
