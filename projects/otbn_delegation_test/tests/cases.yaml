# otbn_delegation_test —— 工程识别信息 + 本工程启用的测试 case
#
# ⚠️ 顶部 meta 块**只是给人和外部工具读的识别信息**；run_all.py 只消费 `cases:` 段，
#    改 meta 不影响回归。各字段均由工程目录/代码导出（改工程即随之变化）。
#
meta:
  board: lsqsh_evb@2os
  cores: 双核
  firmware: [cpu2_controller_otbn_delegation_test, cpu1_target_otbn_delegation_test]
  kconfig: [cpu2_controller_otbn_delegation_test/prj.conf, cpu1_target_otbn_delegation_test/prj.conf]
  run: tests/run_test.py
  env: 片内（OTBN ECDSA/RSA 经 otbn_crypto mbox 通道代理，无外部接线）
  title: OTBN delegation（ECDSA + RSA 族）：cpu2(client) 经 mbox 代理到 cpu1(server)，另含本地对拍
  coverage: tests/COVERAGE.md    # 工程定位 / 测试内容 / 环境需求 / 覆盖矩阵的权威源
#
# 只有 `cases:` 之后、以 `- ` 开头的行才是 case；`#` 开头一律忽略（`#` 屏蔽 = 跳过）。
# 本段决定 `regression/cases.yaml` 路由到本工程后**实际跑哪些 case** ——
# 新增 case：在 `tests/` 下建目录并在此登记（不登记 = 不跑）。
cases:
  - case_default
  - case_dead_channel
  - case_no_server
  - case_throughput
  - case_throughput_iso_proxy
  - case_throughput_iso_local
  - case_throughput_iso_local_hwrng
  - case_entropy_iso
  - case_seq_soak
  - case_explicit_api
  - case_alt_via_proxy
  - case_rsa_delegation
