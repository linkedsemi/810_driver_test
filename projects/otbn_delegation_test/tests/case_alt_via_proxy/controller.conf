# case_alt_via_proxy: the CLIENT routes its OTBN ECDSA alternative THROUGH the
# delegation, so its plain mbedtls_ecdsa_* names ARE the mbox proxy (cell 5 of the
# entry x switch matrix). The shared test body then exercises the plain API (see
# the DELEG_* redirect at the top of tests/src/otbn_delegation_test.c), which is
# what an application / TLS / pk layer would call -- that is the case's purpose.
#
# NB: this selects MBEDTLS_LINKEDSEMI_OTBN_DELEGATION_CLIENT, NOT
# MBEDTLS_LINKEDSEMI_OTBN -- the client keeps no local OTBN driver (asserted at
# compile time by the t90 item).
CONFIG_MBEDTLS_ECDSA_LINKEDSEMI_OTBN_ALT_VIA_DELEGATION=y
