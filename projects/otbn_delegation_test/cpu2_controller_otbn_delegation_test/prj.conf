# SPDX-License-Identifier: Apache-2.0
# cpu2 (controller = delegation CLIENT) project config.
#
# The mbedtls/OTBN block mirrors samples/crypto/otbn/delegation/mbedtls_client
# boards/lsqsh_evb_cpu2.conf (proven to build); the block below it is the 810
# ztest/log/serial convention (810_driver_test/CLAUDE.md §4).

# ---- mbedtls + OTBN ECDSA (from the reference delegation client) ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_CRYPTO_MBEDTLS_SHIM=y

# ecc
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_ALL_ENABLED=y

CONFIG_MBEDTLS_THREADING_LINKEDSEMI_ALT=y


# delegation (this core is the CLIENT: the ECC ops are proxied to cpu1)
CONFIG_MBEDTLS_LINKEDSEMI_OTBN_DELEGATION_CLIENT=y

# ---- 810 ztest / log / serial conventions ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
# 逐项 START/PASS/FAIL 行是 parse_ztest 的数据源，必须打开（KNOWN_ISSUES #26）
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
# ECDSA 调用链较深（bignum/ecp + mbedtls 局部变量），测试线程栈给足
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_GPIO=y
CONFIG_MBOX=y

# libc 三件套（KNOWN_ISSUES #35 / #58）
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n
