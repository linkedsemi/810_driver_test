# crypto_api_test 单核基座配置（cpu1 安全域，lsqsh_evb@1os/lsqsh/cpu1）。
#
# 被测对象 = Zephyr crypto 驱动 API（zephyr/crypto/crypto.h 的
# cipher_*_op / hash_* 系列），驱动本体在 zephyr/drivers/crypto/
# crypto_linkedsemi_{sm4,sha256,sha512}.c。
#
# ⚠️ 具体使能哪颗驱动由各 case 的 case.conf 差异注入
#    （tests/case_*/case.conf，CONF_FILE 合并）。本文件把三颗都**钉成 n**：
#    app.overlay 里三个 DT 节点全局 status="okay"（DT_HAS_*_ENABLED 成立），
#    而这些 Kconfig 的 default 是 y ⇒ 不钉死的话每个 case 都会静默带上全部驱动。

# ---- log 输出规范（CLAUDE.md §4.1：统一 LOG_INF、deferred buf 模式） ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

# ---- ztest 原生框架 ----
# CONFIG_ZTEST_VERBOSE_OUTPUT 是逐项 START/PASS/FAIL 行的门控，必须 =y，
# 否则 harness 只见 PROJECT EXECUTION 一行、逐项结果全 MISSING。
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# ---- libc 三件套（缺一构建失败，KNOWN_ISSUES #58） ----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO support for PA05/PA07 toggle threads ----
CONFIG_GPIO=y

# ---- crypto 子系统（驱动 Kconfig 的 depends 前提） ----
CONFIG_CRYPTO=y

# 驱动基线：三个都关，由 case.conf 按 case 打开
CONFIG_CRYPTO_LINKEDSEMI_SM4=n
CONFIG_CRYPTO_LINKEDSEMI_SHA256=n
CONFIG_CRYPTO_LINKEDSEMI_SHA512=n
