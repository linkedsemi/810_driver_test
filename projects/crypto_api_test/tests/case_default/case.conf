# case_default：Zephyr crypto 驱动 API 全套（一个镜像里同时开三颗驱动）。
#
#   sm4@40029400     CRYPTO_LINKEDSEMI_SM4    → SM4 ECB/CBC/CTR/CCM/GCM
#   sha256@40002800  CRYPTO_LINKEDSEMI_SHA256 → SHA224 / SHA256 / SM3
#   sha512@40005000  CRYPTO_LINKEDSEMI_SHA512 → SHA384 / SHA512
#
# 三颗是不同外设（各自的 IRQ / clock / reset / mutex），同时编入互不冲突，
# 故不按驱动切 case —— 一次构建、一份报告覆盖全部用例（2026-10-29 实测 28 项：
# sm4_api 5 + sm4_err 6 + hash_api 12 + hash_err 5）。
CONFIG_CRYPTO_LINKEDSEMI_SM4=y
CONFIG_CRYPTO_LINKEDSEMI_SHA256=y
CONFIG_CRYPTO_LINKEDSEMI_SHA512=y
