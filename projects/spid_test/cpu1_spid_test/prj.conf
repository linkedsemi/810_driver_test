# spid_test 单核 cpu1 固件配置（SPEC_REFERENCE §6.1.7 / §6.1.8）。

# ---- log 规范（§6.1.7）：统一 LOG_INF，buf 模式异步输出 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
CONFIG_SERIAL=y
CONFIG_SHELL=n

# ---- ztest（§6.2.1）：逐项输出必须打开 ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# ---- libc 三件套（§10.35 / KNOWN_ISSUES #58）----
CONFIG_PICOLIBC=y
CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=n

# ---- GPIO toggle 线程（公共层 gpio_toggle.c 依赖）----
CONFIG_GPIO=y

# ---- 被测驱动：pfr_tpm TPM SPI slave ----
# CONFIG_SPID_LINKEDSEMI 默认 y（depends on DT_HAS_LINKEDSEMI_SPID_ENABLED），
# overlay 使能 tpm_spis1/2 后成立。
CONFIG_SPID_LINKEDSEMI=y

# ---- 外部自环用的 SPI master（master_send_tpm_frame）----
CONFIG_SPI=y
