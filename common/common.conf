# Common configuration for 810_driver_test projects
#
# Usage in your prj.conf:
#   import "common.conf"   # Zephyr 3.4+
#   # OR
#   osource "common.conf"  # Older Zephyr
#   # OR simply copy these lines to your prj.conf

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# Serial/Shell
CONFIG_SERIAL=y
CONFIG_SHELL=y

# ZTest framework
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_VERBOSE_OUTPUT=y
CONFIG_ZTEST_SUMMARY=n

# GPIO for PA05/PA07 toggle threads
CONFIG_GPIO=y

# Minimal libc
CONFIG_MINIMAL_LIBC=y
CONFIG_NEWLIB_LIBC=n
