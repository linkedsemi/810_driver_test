# case_abl / abl_b5 —— 基线 + shell 正在执行一条命令（由 shell 命令触发扫描）
#
# 任务书 B5（★）：客户是"通过 shell 命令调用 I2CF"，810 的 shell 一直空转。
#   本 conf 用固件新命令 `scanburst`（CONFIG_I2CF_SCAN_BURST_SHELL）**由 shell 线程
#   触发**同样的逐址扫描 ⇒ shell 线程在扫描期间被占，日志只能先堆进 mpsc buffer。
#   采集侧：发 `scanburst\r` 后测 SCAN_BURST_BEGIN→END 的到达时间差（run_b5.py）。
#
# ⚠️ 本 conf **不置 CONFIG_I2CF_SCAN_BURST**（避免开机自跑一次扫描污染测量）。
# ⚠️ .conf 不支持行内注释。

CONFIG_SHELL=y
CONFIG_SHELL_AUTOSTART=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=100
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8

CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=n

# ==== B5 新增项：shell 触发扫描的命令 ====
CONFIG_I2CF_SCAN_BURST_SHELL=y
