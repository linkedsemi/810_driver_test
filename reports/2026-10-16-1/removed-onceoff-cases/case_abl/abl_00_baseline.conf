# case_abl / abl_00_baseline —— 同批基线
#
# = 上次消融用的「客户日志配置」（reports/2026-10-14-4 的 scan_burst_shell conf），
#   逐字复制。目的：与旧 12 ms/行 值**同批**可比（不引用旧值）。
#
# 固件标记块复用 i2cf::scan_burst_drain（CONFIG_I2CF_SCAN_BURST）。
#
# ⚠️ Zephyr .conf 不支持行内注释（`X=1 # 注` 整串当值 ⇒ Kconfig 中止）。注释独占一行。

# ---- 编入既有 marker 块 ----
CONFIG_I2CF_SCAN_BURST=y

# ---- SHELL（810 prj.conf =n，本 conf 覆盖为 y）----
CONFIG_SHELL=y
CONFIG_SHELL_AUTOSTART=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=100
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8

# ---- LOG（覆盖 810 prj.conf 的 SLEEP_MS=10 / BUFFER_SIZE=16384）----
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PRINTK=y

# 客户 .config 中 LOG_BACKEND_UART 未 set；日志只经 SHELL_LOG_BACKEND 出。
CONFIG_LOG_BACKEND_UART=n
