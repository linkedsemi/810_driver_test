# case_abl / abl_b3 —— 基线 + SHELL_ECHO_STATUS=y + SHELL_PRINTF_BUFF_SIZE=30
#                        + LOG_TRACE_SHORT_TIMESTAMP=y
#
# 任务书 B3：客户 .config 三项，上次照抄漏掉。
# 机制猜想：ECHO_STATUS 让 shell 对状态/回显更频繁刷新；PRINTF_BUFF_SIZE=30（默认 128）
# 让 shell 单次 printf 缓冲变小 ⇒ 一条长日志被切成更多次 shell transport 写入；
# LOG_TRACE_SHORT_TIMESTAMP 改时间戳格式。
#
# ⚠️ .conf 不支持行内注释。

CONFIG_I2CF_SCAN_BURST=y

CONFIG_SHELL=y
CONFIG_SHELL_AUTOSTART=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=100
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8

CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=n

# ==== B3 新增项（唯三变化）====
CONFIG_SHELL_ECHO_STATUS=y
CONFIG_SHELL_PRINTF_BUFF_SIZE=30
CONFIG_LOG_TRACE_SHORT_TIMESTAMP=y
