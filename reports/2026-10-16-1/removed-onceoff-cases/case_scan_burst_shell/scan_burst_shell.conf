# case_scan_burst_shell —— 一次性诊断 conf（复用 case_scan_burst 的 marker 块）
#
# 目的：把 case_scan_burst（SHELL=n + LOG_BACKEND_UART=y，排空 ~1.0s）的**日志配置**
#       换成客户那套（SHELL=y + SHELL_LOG_BACKEND=y），复现客户观察到的**排空劣化**
#       （客户 ~178 ms/行 → 112 行 ≈ 20s）。
#
# 固件侧：直接复用 i2cf::scan_burst_drain（BEGIN/END marker 不变）——
#         故本 case **不需要新 Kconfig 开关、不改任何固件/C 代码**，只换 conf。
#         （task 建议的 CONFIG_I2CF_SCAN_BURST_SHELL 若另设需复制 marker 块；
#          这里走"同开关 ⇒ 不复制"的许可路径，爆炸半径最小。）
#
# ⚠️ Zephyr 的 .conf 解析器**不支持行内注释** —— `X=1 # 注` 会把整串当值
#    （实测：报 value '1000    # ...' invalid，Kconfig 中止）。注释一律独占一行。

# ---- 编入既有 marker 块（同 case_scan_burst）----
CONFIG_I2CF_SCAN_BURST=y

# ============================================================================
# Phase 1：逐项照抄客户 .config（d:/zephyr4_0/tmp/.config）的 shell / log 配置
# ============================================================================

# ---- SHELL（810 prj.conf 现有 =n，本 case 覆盖为 y）----
CONFIG_SHELL=y
CONFIG_SHELL_AUTOSTART=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=100
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8

# ---- LOG（覆盖 810 prj.conf 的 SLEEP_MS=10 / BUFFER_SIZE=16384）----
# 810 prj.conf: LOG_PROCESS_THREAD_SLEEP_MS = 10; 客户 = 1000
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
# 810 prj.conf: LOG_BUFFER_SIZE = 16384; 客户 = 8192
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PRINTK=y

# ★ 客户 .config 中 CONFIG_LOG_BACKEND_UART **未 set**（=n）；810 prj.conf 是 y。
#   客户场景下日志**只**经 SHELL_LOG_BACKEND 出 —— 显式覆盖为 n，否则
#   UART 直出后端会绕过 shell 队列、掩盖本 case 要复现的瓶颈（Phase 2 -c 反过来验证）。
CONFIG_LOG_BACKEND_UART=n
