# case_wave —— 循环波形发生器（示波器抓取 read/write 事务）
#
# 目的：让总线以 ~420ms 周期反复发 **一笔写 + 一笔读**（地址 0x33 = i2c3 上的片内
#       target eeprom@33，位于 i2cf4 输出侧/下游），用标记 GPIO 供示波器触发与译码。
#       两相位**都 filter ON**，只切「0x33 是否在白名单」：
#         偶数轮 A（PHASE 低）= 授权 0x33  ⇒ 放行/ACK，无中断
#         奇数轮 B（PHASE 高）= 关 ch0     ⇒ 拦 + NACK + 上报
#       目的 = 示波器上"授权 vs 未授权"两段直接对比（不掺入"关滤波器"怪象）。
#       标记：TRIG=PA06（事务包络）、DIR=PA04（写低/读高）、PHASE=PA05（A低/B高）。
#
# 只发波形、不含 zassert 判据；不登记进 regression/cases.yaml（一次性波形用例）。
# 注：波形模式下框架的 common/gpio_toggle.c 被摘掉（PA05 需独占，见 CMakeLists）。
CONFIG_I2CF_WAVE_GEN=y
