# case_mwrite_probe —— 一次性探针 conf（Phase 3）
#
# 目的：观测 MASTER_WRITE_MODE（SMBUS_FILTER_SET bit3，驱动恒写 0、无 API）置 1 后，
#       **read 方向**的地址扫描是否仍触发 filter（"address beyond whitelist"）。
# 客户预期：scan 时 read 的帧不该触发 filter 日志 —— 与本位语义相符（纯推断）。
#
# 只观测、不断言（见 cpu1_i2cf_test/Kconfig 的 I2CF_MWRITE_PROBE 说明）。
CONFIG_I2CF_MWRITE_PROBE=y
