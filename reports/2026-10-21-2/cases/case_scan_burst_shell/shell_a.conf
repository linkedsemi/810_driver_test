# One-off diagnostic conf for shell-log-backend queue pacing measurement.
# Firmware action = i2cf::scan_burst_drain (CONFIG_I2CF_SCAN_BURST), unchanged.
# Base = customer configuration (SHELL_LOG_BACKEND, QUEUE=512, TIMEOUT=100,
# TX_RING=8, LOG_PROCESS_THREAD_SLEEP_MS=1000, LOG_BUFFER_SIZE=8192,
# LOG_BACKEND_UART=n). Comments must be on their own line (Zephyr .conf does
# not accept inline comments).
# Group A: customer baseline: TIMEOUT=100, QUEUE=512

CONFIG_I2CF_SCAN_BURST=y

CONFIG_SHELL=y
CONFIG_SHELL_AUTOSTART=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=100
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8

CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=n
